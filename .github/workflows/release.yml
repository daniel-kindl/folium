name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version X.Y.Z. It must match FoliumVersion in Directory.Build.props.
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require the main branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "The release workflow can run only from main. The current ref is ${GITHUB_REF}." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload restore
      - name: Restore and audit dependencies
        run: dotnet restore --locked-mode -p:NuGetAuditLevel=high -p:NuGetAuditMode=all -warnaserror:NU1903,NU1904
      - name: Verify formatting and code style
        run: dotnet format --verify-no-changes --no-restore
      - name: Build with analyzers
        run: dotnet build --configuration Release --no-restore
      - name: Test with coverage
        run: dotnet test --project tests/Folium.Tests/Folium.Tests.csproj --configuration Release --no-build --no-restore --results-directory coverage -- --coverlet --coverlet-output-format cobertura
      - name: Resolve the release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION}"
          printf '%s' "${version}" > "${RUNNER_TEMP}/version.txt"
          printf '%s' "${GITHUB_SHA}" > "${RUNNER_TEMP}/sha.txt"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Check the release version and CHANGELOG
        run: |
          set -euo pipefail
          version="$(cat "${RUNNER_TEMP}/version.txt")"
          dotnet run --project tools/CheckReleaseVersion --configuration Release --no-build --no-restore -- \
            --version "${version}" \
            --props Directory.Build.props \
            --changelog CHANGELOG.md \
            --git-tags \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folium-release-meta
          path: |
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/sha.txt
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload restore
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Decode the release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]; then
            echo "The ANDROID_RELEASE_KEYSTORE_BASE64 secret is missing." >&2
            exit 1
          fi
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/folium-release.keystore"
          test -s "${RUNNER_TEMP}/folium-release.keystore"
      - name: Build the signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_RELEASE_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_RELEASE_KEY_PASSWORD}" ] || [ -z "${ANDROID_RELEASE_KEY_ALIAS}" ]; then
            echo "A signing secret is missing." >&2
            exit 1
          fi
          # env: is documented only for AndroidSigningKeyPass and AndroidSigningStorePass.
          # https://github.com/dotnet/android/blob/main/Documentation/docs-mobile/building-apps/build-properties.md
          # AndroidSigningKeyAlias is the alias itself. GitHub masks the secret in the log.
          dotnet publish src/Folium.Android/Folium.Android.csproj \
            --configuration Release \
            --no-restore \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="${RUNNER_TEMP}/folium-release.keystore" \
            -p:AndroidSigningKeyAlias="${ANDROID_RELEASE_KEY_ALIAS}" \
            -p:AndroidSigningStorePass=env:ANDROID_RELEASE_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_RELEASE_KEY_PASSWORD
          version="${RELEASE_VERSION}"
          publish_dir="src/Folium.Android/bin/Release/net10.0-android/publish"
          mapfile -t apks < <(find "${publish_dir}" -maxdepth 1 -type f -name '*-Signed.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one signed APK in ${publish_dir}." >&2
            find "${publish_dir}" -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          cp -- "${apks[0]}" "${RUNNER_TEMP}/folium-${version}.apk"
      - name: Remove the keystore
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/folium-release.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folium-release-apk
          path: ${{ runner.temp }}/folium-${{ needs.validate.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folium-release-meta
          path: "${{ runner.temp }}/folium-release"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folium-release-apk
          path: "${{ runner.temp }}/folium-release"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          sha="${RELEASE_SHA}"
          apk="${RUNNER_TEMP}/folium-release/folium-${version}.apk"
          notes="${RUNNER_TEMP}/folium-release/release-notes.md"
          test -s "${apk}"
          test -s "${notes}"
          test -n "${sha}"
          gh release create "v${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${sha}" \
            --title "v${version}" \
            --notes-file "${notes}" \
            "${apk}"
