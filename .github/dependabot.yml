version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A conventional commit title with no scope stays short.
    commit-message:
      prefix: ci
  - package-ecosystem: nuget
    directories:
      - /src/Folium
      - /src/Folium.Android
      - /tests/Folium.Tests
    schedule:
      interval: weekly
    commit-message:
      prefix: build
